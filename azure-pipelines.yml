# Builds the Next.js static export and deploys it to Cloudflare Pages.
#
# Required pipeline variables (Pipelines > Edit > Variables):
#   CLOUDFLARE_API_TOKEN   (secret) API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID
#
# The Pages project name and output directory come from wrangler.toml.
# master deploys to production; other branches and PRs deploy as preview deployments.

trigger:
- master

pr:
- master

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: npm ci
  displayName: 'Install dependencies'

- script: npm run lint
  displayName: 'Lint'

- script: npm run build
  displayName: 'Build static export'

- bash: |
    # PR builds check out a merge ref, so deploy under the PR's source branch instead.
    BRANCH="${SYSTEM_PULLREQUEST_SOURCEBRANCH:-$BUILD_SOURCEBRANCH}"
    BRANCH="${BRANCH#refs/heads/}"
    npx wrangler pages deploy --branch "$BRANCH" --commit-hash "$BUILD_SOURCEVERSION"
  displayName: 'Deploy to Cloudflare Pages'
  env:
    CLOUDFLARE_API_TOKEN: $(CLOUDFLARE_API_TOKEN)
    CLOUDFLARE_ACCOUNT_ID: $(CLOUDFLARE_ACCOUNT_ID)

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'out'
    ArtifactName: 'site'
    publishLocation: 'Container'
  displayName: 'Publish site artifact'
